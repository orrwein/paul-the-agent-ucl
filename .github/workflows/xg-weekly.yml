# Weekly expected-goals refresh.
#
# Why this is its own workflow and not a step in nightly.yml:
#
#   * It is the ONLY thing in the project needing a third-party package
#     (soccerdata). nightly.yml installs nothing, and that is worth keeping —
#     a dependency resolution failure must not be able to stop the daily
#     results-and-simulate run.
#   * The signal it refreshes moves on a scale of weeks, not days. A club's
#     20-match rolling xG barely shifts between Tuesday and Wednesday.
#   * It reaches Understat through a TLS-fingerprint shim, because the site
#     sits behind bot protection. Weekly and low-volume is a materially
#     smaller ask than nightly, and it is one fetch of five league schedules.
#
# It runs Monday, after the weekend's domestic fixtures have settled and
# before the midweek European round — the point in the week when a refreshed
# form line has the most chance of changing a pick.
#
# If Understat blocks GitHub's datacenter IPs this job will fail and the
# fallback is a local scheduled run; see README "Operations".

name: Weekly xG refresh

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      probe_only:
        description: "Just check Understat is reachable, skip the refresh"
        type: boolean
        default: false

concurrency:
  group: xg-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the optional xG dependency
        run: pip install -r requirements.txt

      # Can we reach the source AT ALL from a GitHub runner? Understat sits
      # behind bot protection and datacenter IP ranges are exactly what that
      # protection targets, so this is not a given — and before the draw the
      # refresh below is skipped, which would otherwise let this workflow go
      # green every week while proving nothing.
      #
      # One league, one completed season: the smallest fetch that answers the
      # question. Also the first thing to run by hand if the Monday job starts
      # failing months from now.
      - name: Probe the xG source
        env:
          SOCCERDATA_DIR: ${{ github.workspace }}/data/soccerdata
        run: |
          mkdir -p "$SOCCERDATA_DIR/config"
          python3 - <<'PY'
          import warnings; warnings.filterwarnings("ignore")
          import soccerdata as sd
          try:
              df = sd.Understat(leagues="ENG-Premier League",
                                seasons="2025-2026").read_schedule()
              n = len(df)
              xg = df["home_xg"].notna().sum() if "home_xg" in df else 0
              print(f"::notice::Understat reachable from this runner: "
                    f"{n} matches, {xg} with xG.")
              if not n or not xg:
                  raise SystemExit("::error::Reachable but returned no xG.")
          except SystemExit:
              raise
          except Exception as e:
              raise SystemExit(
                  f"::error::Understat unreachable from GitHub's IP range "
                  f"({type(e).__name__}: {e}). The weekly refresh cannot run "
                  f"here; fall back to a local scheduled run.")
          PY

      - name: Check the field is drawn
        if: ${{ !inputs.probe_only }}
        id: state
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sqlite3
          con = sqlite3.connect("data/ucl2627.db")
          n = con.execute("SELECT COUNT(*) FROM teams").fetchone()[0]
          print(f"teams={n}")
          PY

      - name: Refresh team form from expected goals
        if: steps.state.outputs.teams != '0'
        # xg_update.py records its own heartbeat: clubs measured, clubs
        # rescaled, leagues re-weighted. Those three numbers are exactly what
        # this workflow's own first dispatch lacked when it went green having
        # skipped every step behind the pre-draw gate below.
        run: python3 scripts/xg_update.py --seasons 2026-2027

      - name: Rebuild the site payload
        if: steps.state.outputs.teams != '0'
        run: python3 scripts/export_site.py

      # -------------------------------------------------------------------
      # Every path out of this workflow leaves a heartbeat, because the two
      # quiet ones are the dangerous ones. A probe-only dispatch and a
      # pre-draw Monday both do no work by design; recording nothing would
      # make them look identical to a cron that has stopped firing, which is
      # the failure this panel exists to catch.
      # -------------------------------------------------------------------
      - name: Record the skip (probe only)
        if: ${{ inputs.probe_only }}
        run: |
          python3 scripts/jobs.py record xg --outcome skipped \
            --note "probe-only dispatch: Understat reachability confirmed, form deliberately not refreshed"

      - name: Record the skip (waiting for the draw)
        if: ${{ !inputs.probe_only && steps.state.outputs.teams == '0' }}
        run: |
          echo "::notice::No teams yet (draw is 27 Aug 2026) — nothing to refresh."
          python3 scripts/jobs.py record xg --outcome skipped \
            --note "no clubs in the database yet — the league-phase draw is 27 Aug 2026"

      - name: Record the failure
        # The probe above kills the job with SystemExit before xg_update.py is
        # ever reached, so nothing else would write this down. Understat
        # blocking GitHub's IP range is the single most likely way this job
        # dies months from now, and it should say so on the site rather than
        # only in an Actions run nobody opens.
        if: failure()
        run: |
          python3 scripts/jobs.py record xg --outcome failed \
            --note "the weekly run failed before it could refresh anything — most likely Understat refusing this runner; see the run log"

      - name: Commit if anything moved
        # `always()`, and the database is staged unconditionally: on a skipped
        # or failed week the heartbeat IS the only thing that moved, and it is
        # the week it matters most. The refreshed payload reaches the site on
        # the next nightly, which runs within 24 hours and deploys.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ucl2627.db docs/data.json
          if git diff --cached --quiet; then
            echo "::notice::No change in form this week."
          else
            git commit -m "Weekly xG refresh"
            git push
          fi
