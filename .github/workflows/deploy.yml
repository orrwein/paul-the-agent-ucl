# Deploy on a human push to main.
#
# This covers exactly one case: someone commits and pushes by hand (a locked
# round from scripts/round.py, a weekly scripts/xg_update.py run, a site tweak).
# It regenerates docs/data.json from the committed database and publishes.
#
# It does NOT cover the nightly data refresh. That workflow commits with the
# default GITHUB_TOKEN, and GitHub does not raise workflow triggers for such
# pushes — so this file would never see them. nightly.yml therefore runs its own
# deploy job at the end instead of relying on this one. Keep both: they handle
# different triggers, and neither is redundant.
#
# Safe before the league-phase draw: export_site.py detects the empty database
# and emits a "pre_draw" payload rather than failing.

name: Deploy Paul the Agent to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate site data from database
        # This also writes the `export` heartbeat — into a database on a runner
        # that is thrown away, since this workflow has read-only contents
        # permission and commits nothing. That is fine and deliberate:
        # export_site splices its own still-open heartbeat into the payload it
        # is writing, so the published page always carries the timestamp of the
        # run that built it. The row in the database would only be a duplicate
        # of what the page already says.
        run: python scripts/export_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
